steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    env:
      - 'DOCKER_BUILDKIT=1'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE_NAME}'
      - '.'
  
  # Step 2: Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_IMAGE_NAME}'

options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _IMAGE_NAME: 'europe-west1-docker.pkg.dev/dtumlops-447808/mlops-group40/leaf:latest'
