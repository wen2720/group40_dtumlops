name: "Run tests"

on:
  push:
    branches:
      - main 
      - lise
      - justine 
      - ruikangzhao
      - devWen
      - test # test branch, besides the steps of job also runs other job
  pull_request:
    branches:
      - main 
      - lise
      - justine 
      - ruikangzhao
      - devWen

jobs:
  test:
     if: github.ref != 'refs/heads/test'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest", "macos-latest"]
        python-version: ["3.12", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install test dependencies
        run: pip install -r requirements_tests.txt

      - name: Run linter (flake8)
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests & coverage
        run: |
          coverage run -m pytest tests/ --ignore=tests/integrationtests/
          coverage report -m

    test-on-push-test-branch:
      if: github.ref == 'refs/heads/test'
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Authenticate with GCP
          uses: google-github-actions/auth@v1
          with:
            credentials_json: ${{ secrets.GS_BUCKET }}

        - name: Configure Docker for GCP
          run: gcloud auth configure-docker

        - name: Build Docker Image
          run: |
            export IMAGE_NAME=europe-west1-docker.pkg.dev/dtumlops-447808/mlops-group40/leaf:latest
            docker build -t $IMAGE_NAME .

        - name: Push Docker Image to GCP
          run: |
            export IMAGE_NAME=europe-west1-docker.pkg.dev/dtumlops-447808/mlops-group40/leaf:latest
            docker push $IMAGE_NAME
  Key Details 
